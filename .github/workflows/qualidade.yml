name: Qualidade

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: CSS compilado está atualizado
        run: |
          npm run build:css
          git diff --exit-code assets/tailwind.css || (echo "Rode 'npm run build:css' e faça commit de assets/tailwind.css" && exit 1)
